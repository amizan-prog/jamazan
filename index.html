<!DOCTYPE html>
<html lang="ms" data-theme="masjid">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jam Azan Pintar - Slideshow Masjid Malaysia</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <!-- Adhan.js untuk pengiraan waktu solat secara offline -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/adhan/4.0.0/adhan.umd.min.js"></script>
</head>
<body>
    <!-- Latar Belakang Slideshow Masjid -->
    <div id="bg-slideshow"></div>
    <div class="bg-overlay"></div>

    <header class="top-bar glass">
        <div class="datetime">
            <h1 id="time">00:00:00</h1>
            <p id="date">Tarikh Semasa</p>
        </div>
        <div class="controls">
            <select id="theme-selector">
                <option value="masjid">Tema Masjid (Hijau)</option>
                <option value="dark">Tema Gelap</option>
                <option value="light">Tema Cerah</option>
            </select>
        </div>
    </header>

    <main class="content-grid">
        <!-- Bahagian Waktu Solat -->
        <section class="prayer-times">
            <h2 class="section-title glass-title">Waktu Solat</h2>
            <div class="prayer-card glass" id="pt-subuh"><span>Subuh</span> <span class="time">--:--</span></div>
            <div class="prayer-card glass" id="pt-syuruk"><span>Syuruk</span> <span class="time">--:--</span></div>
            <div class="prayer-card glass" id="pt-zohor"><span>Zohor</span> <span class="time">--:--</span></div>
            <div class="prayer-card glass" id="pt-asar"><span>Asar</span> <span class="time">--:--</span></div>
            <div class="prayer-card glass" id="pt-maghrib"><span>Maghrib</span> <span class="time">--:--</span></div>
            <div class="prayer-card glass" id="pt-isyak"><span>Isyak</span> <span class="time">--:--</span></div>
        </section>

        <!-- Bahagian Pengumuman & Media dengan Penjadwalan -->
        <section class="media-section glass">
            <div id="media-container">
                <!-- Untuk Live Streaming / YouTube -->
                <iframe id="live-stream" width="100%" height="100%" frameborder="0" allowfullscreen style="display:none;"></iframe>
                
                <!-- Untuk Video Tempatan -->
                <video id="custom-video" width="100%" height="100%" controls autoplay muted loop style="display:none;"></video>

                <!-- Untuk Gambar (Laporan Kewangan / Jadual Khatib) -->
                <img id="custom-image" width="100%" height="100%" style="object-fit: contain; display:none;" />
                
                <!-- Mesej Default jika tiada media dijadualkan -->
                <div id="default-screen" class="default-msg">
                    <h2>Jam Azan Pintar Masjid</h2>
                    <p>Paparan Maklumat & Slideshow Masjid-Masjid Utama Malaysia</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Selingan Ayat Al-Quran & Hadis (Ticker) -->
    <footer class="islamic-quotes glass">
        <div class="quote-container">
            <p id="arabic-text" class="arabic">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</p>
            <p id="malay-translation" class="translation">Dengan nama Allah Yang Maha Pemurah lagi Maha Penyayang.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
